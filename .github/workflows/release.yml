name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0). Leave empty to auto-increment from latest release.'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine release tag
        id: determine_tag
        run: |
          if [ -n "$INPUT_TAG" ]; then
            NEW_TAG="$INPUT_TAG"
          else
            # 最新のリリースタグを取得
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || echo "")

            VERSION_COMPONENT='(0|[1-9][0-9]{0,17})'
            LATEST_TAG_REGEX="^v${VERSION_COMPONENT}\.${VERSION_COMPONENT}\.${VERSION_COMPONENT}(-rc${VERSION_COMPONENT})?$"
            if [ -n "$LATEST_TAG" ] && [[ ! "$LATEST_TAG" =~ $LATEST_TAG_REGEX ]]; then
              echo "Latest release tag has an unsupported format." >&2
              exit 1
            fi

            if [ -z "$LATEST_TAG" ]; then
              # リリースが存在しない場合
              if [ "$IS_PRERELEASE" = "true" ]; then
                NEW_TAG="v0.0.1-rc1"
              else
                NEW_TAG="v0.0.1"
              fi
            else
              if [ "$IS_PRERELEASE" = "true" ]; then
                # Pre-releaseの場合
                if [[ "$LATEST_TAG" =~ -rc([0-9]+)$ ]]; then
                  # 既に -rc タグが存在する場合、番号をインクリメント
                  RC_NUM="${BASH_REMATCH[1]}"
                  BASE_TAG="${LATEST_TAG%-rc*}"
                  RC_NUM=$((RC_NUM + 1))
                  NEW_TAG="${BASE_TAG}-rc${RC_NUM}"
                else
                  # -rc タグが存在しない場合、バージョンをインクリメントして -rc1 を追加
                  VERSION=${LATEST_TAG#v}
                  MAJOR=$(echo $VERSION | cut -d. -f1)
                  MINOR=$(echo $VERSION | cut -d. -f2)
                  PATCH=$(echo $VERSION | cut -d. -f3)
                  PATCH=$((PATCH + 1))
                  NEW_TAG="v$MAJOR.$MINOR.$PATCH-rc1"
                fi
              else
                # 通常リリースの場合
                if [[ "$LATEST_TAG" =~ -rc[0-9]+$ ]]; then
                  # 最新タグが -rc の場合、-rc を取り除く
                  NEW_TAG="${LATEST_TAG%-rc*}"
                else
                  # 通常のタグの場合、パッチバージョンをインクリメント
                  VERSION=${LATEST_TAG#v}
                  MAJOR=$(echo $VERSION | cut -d. -f1)
                  MINOR=$(echo $VERSION | cut -d. -f2)
                  PATCH=$(echo $VERSION | cut -d. -f3)
                  PATCH=$((PATCH + 1))
                  NEW_TAG="v$MAJOR.$MINOR.$PATCH"
                fi
              fi
            fi

          fi

          if ! git check-ref-format "refs/tags/$NEW_TAG"; then
            echo "Invalid release tag format." >&2
            exit 1
          fi

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $NEW_TAG"
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}

      - name: Set release name
        id: release_name
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "name=Prerelease $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.determine_tag.outputs.tag }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease }}

      - name: Set image tags
        id: image_tags
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            {
              echo "tags<<EOF"
              echo "$REGISTRY:$TAG"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "$REGISTRY:$TAG"
              echo "$REGISTRY:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.determine_tag.outputs.tag }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}/discord-bot-go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.determine_tag.outputs.tag }}
          cache-from: type=gha,scope=discord-bot-go
          cache-to: type=gha,scope=discord-bot-go,mode=max,ignore-error=true
          tags: ${{ steps.image_tags.outputs.tags }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.determine_tag.outputs.tag }}
          name: ${{ steps.release_name.outputs.name }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
